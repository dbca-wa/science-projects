name: Deploy Production

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.*.*"
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: dbca-wa/science-projects

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  # ====================== DETECT CHANGES ======================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.override.outputs.frontend }}
      backend: ${{ steps.override.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # For tagged releases, always build both frontend and backend
      - name: Set build flags for release
        id: override
        run: |
          echo "frontend=true" >> $GITHUB_OUTPUT
          echo "backend=true" >> $GITHUB_OUTPUT
          echo "✅ Tagged release detected - building both frontend and backend"

  # ====================== RUN TESTS ======================
  run-tests:
    name: Run Tests
    needs: detect-changes
    uses: ./.github/workflows/test.yml

  # ====================== BUILD FRONTEND PRODUCTION ======================
  build-frontend-prod:
    name: Build Frontend (${{ matrix.arch }})
    needs: [run-tests, detect-changes]
    if: |
      success() &&
      needs.detect-changes.outputs.frontend == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Build and push Frontend image (per-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          build-args: |
            VITE_VERSION=${{ steps.version.outputs.VERSION }}
            VITE_SENTRY_DSN=https://8dd0517876955893e7c6c13dda43ae8b@o4506736817405952.ingest.us.sentry.io/4507297807663104
          cache-from: type=gha,scope=frontend-prod-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=frontend-prod-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Science Projects Frontend
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ====================== MERGE FRONTEND MANIFEST ======================
  merge-frontend-prod:
    name: Merge Frontend Manifest
    runs-on: ubuntu-latest
    needs: [build-frontend-prod, detect-changes]
    if: |
      success() &&
      needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create and push multi-arch manifest
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend

          docker buildx imagetools create \
            -t ${IMAGE}:${VERSION} \
            -t ${IMAGE}:stable \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

  # ====================== BUILD BACKEND PRODUCTION ======================
  build-backend-prod:
    name: Build Backend (${{ matrix.arch }})
    needs: [run-tests, detect-changes]
    if: |
      success() &&
      needs.detect-changes.outputs.backend == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Build and push Backend image (per-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          cache-from: type=gha,scope=backend-prod-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-prod-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Science Projects Backend (Production)
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ====================== MERGE BACKEND MANIFEST ======================
  merge-backend-prod:
    name: Merge Backend Manifest
    runs-on: ubuntu-latest
    needs: [build-backend-prod, detect-changes]
    if: |
      success() &&
      needs.detect-changes.outputs.backend == 'true'

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create and push multi-arch manifest
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend

          docker buildx imagetools create \
            -t ${IMAGE}:${VERSION} \
            -t ${IMAGE}:stable \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

  # ====================== UPDATE COVERAGE BADGES ======================
  update-coverage-badges:
    name: Update Coverage Badges
    needs: run-tests
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git with bot credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download coverage percentages
        uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage-percentage'
          path: coverage-percentages

      - name: Update frontend badge in README
        run: |
          if [ -f "coverage-percentages/frontend-coverage-percentage/coverage-percentage.txt" ]; then
            COVERAGE_RAW=$(cat coverage-percentages/frontend-coverage-percentage/coverage-percentage.txt)
            if ! [[ "$COVERAGE_RAW" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              echo "⚠️  Warning: Invalid frontend coverage format: $COVERAGE_RAW"
              echo "Skipping frontend badge update"
            else
              COVERAGE=$(echo "$COVERAGE_RAW" | cut -d'.' -f1)
              COLOR="red"
              if [ "$COVERAGE" -ge 80 ]; then COLOR="brightgreen"
              elif [ "$COVERAGE" -ge 70 ]; then COLOR="green"
              elif [ "$COVERAGE" -ge 60 ]; then COLOR="yellow"
              elif [ "$COVERAGE" -ge 50 ]; then COLOR="orange"
              fi
              sed -i "s|frontend--coverage-[0-9]*%25-[a-z]*|frontend--coverage-${COVERAGE}%25-${COLOR}|g" README.md
              echo "✅ Updated frontend badge: ${COVERAGE}% (${COLOR})"
            fi
          else
            echo "⚠️  Warning: Frontend coverage file not found"
          fi

      - name: Update backend badge in README
        run: |
          if [ -f "coverage-percentages/backend-coverage-percentage/coverage-percentage.txt" ]; then
            COVERAGE_RAW=$(cat coverage-percentages/backend-coverage-percentage/coverage-percentage.txt)
            if ! [[ "$COVERAGE_RAW" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              echo "⚠️  Warning: Invalid backend coverage format: $COVERAGE_RAW"
              echo "Skipping backend badge update"
            else
              COVERAGE=$(echo "$COVERAGE_RAW" | cut -d'.' -f1)
              COLOR="red"
              if [ "$COVERAGE" -ge 80 ]; then COLOR="brightgreen"
              elif [ "$COVERAGE" -ge 70 ]; then COLOR="green"
              elif [ "$COVERAGE" -ge 60 ]; then COLOR="yellow"
              elif [ "$COVERAGE" -ge 50 ]; then COLOR="orange"
              fi
              sed -i "s|backend--coverage-[0-9]*%25-[a-z]*|backend--coverage-${COVERAGE}%25-${COLOR}|g" README.md
              echo "✅ Updated backend badge: ${COVERAGE}% (${COLOR})"
            fi
          else
            echo "⚠️  Warning: Backend coverage file not found"
          fi

      - name: Commit and push badge updates
        run: |
          git add README.md
          git commit -m "chore: update coverage badges [skip ci]" || exit 0
          git pull --rebase origin main
          git push

  # ====================== UPDATE KUSTOMIZE ======================
  update-kustomize:
    name: Update Kustomize Configurations
    needs: [detect-changes, merge-frontend-prod, merge-backend-prod]
    runs-on: ubuntu-latest
    if: |
      always() && 
      (needs.merge-frontend-prod.result == 'success' || needs.merge-backend-prod.result == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Update kustomize image tags
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          echo "=== Updating Kustomize image tags to ${VERSION} ==="

          # Update production kustomization.yaml only.
          # The test overlay tracks the moving ":test" tag built from the
          # staging branch for fast iteration — it must not be pinned to a
          # release version here (this works with image pull policy always).
          if [ -f "kustomize/overlays/prod/kustomization.yaml" ]; then
            sed -i "s|newTag: .*|newTag: ${VERSION}|g" kustomize/overlays/prod/kustomization.yaml
            echo "✅ Updated production kustomization.yaml"
            echo ""
            echo "=== Changes to production ==="
            git diff kustomize/overlays/prod/kustomization.yaml
          else
            echo "❌ Warning: kustomize/overlays/prod/kustomization.yaml not found"
            exit 1
          fi

      - name: Commit and push kustomize updates
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          if git diff --quiet kustomize/; then
            echo "✅ No changes to commit (versions already up to date)"
          else
            git add kustomize/overlays/prod/kustomization.yaml
            git commit -m "chore: update kustomize to ${VERSION} [skip ci]"

            # Pull with rebase to handle concurrent pushes from other jobs
            # (e.g. coverage badge updates that push to main in parallel)
            git pull --rebase origin main
            git push origin HEAD:main
            echo "✅ Kustomize versions updated to ${VERSION}"
          fi

      - name: Sync staging with main
        run: |
          git fetch origin main
          git checkout -B staging origin/main
          git push origin staging --force
          echo "✅ Staging branch synced with main"

      - name: Deployment summary
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          echo "## Deployment Configuration Updated" >> $GITHUB_STEP_SUMMARY
          echo "✅ Kustomize overlays updated to version ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Updated Images" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ghcr.io/dbca-wa/science-projects-frontend:${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ghcr.io/dbca-wa/science-projects-backend:${VERSION}" >> $GITHUB_STEP_SUMMARY

  # ====================== CLEANUP OLD PACKAGE VERSIONS ======================
  cleanup-packages:
    name: Cleanup Old Package Versions
    runs-on: ubuntu-latest
    needs: [merge-frontend-prod, merge-backend-prod]
    if: |
      always() &&
      (needs.merge-frontend-prod.result == 'success' || needs.merge-backend-prod.result == 'success')

    steps:
      # Release-safe pruning. A flat "keep N most recent versions" rule counts
      # the moving test/test-* tags and per-arch build parts against the budget,
      # which pushes real release manifests out of the window and deletes
      # production images the cluster still needs.
      #
      # The prune script (.github/scripts/prune_ghcr.py) instead:
      #   * keeps the newest KEEP_RELEASES releases chosen by SEMVER order, and
      #     resolves each kept index's child digests from the registry so a kept
      #     release can never be orphaned;
      #   * always keeps 'stable' and the single latest 'test' build;
      #   * prunes a beyond-quota release only once the quota is genuinely
      #     exceeded, deleting that release and all its children together;
      #   * removes orphaned untagged leftovers beyond KEEP_JUNK;
      #   * ABORTS (deletes nothing) if it cannot resolve a release's children,
      #     if the listing is empty, or if a deletion would ever hit a protected
      #     version — so a bug or a flaky API can never eat a release.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Safety gate: the prune logic's guarantees are unit-tested. If the tests
      # fail, the prune steps below do not run (this step is NOT best-effort).
      - name: Verify prune logic (unit tests)
        run: python3 .github/scripts/test_prune_ghcr.py

      # KEEP_RELEASES: tagged semver releases to retain, each with all children.
      # KEEP_JUNK: orphaned untagged leftover layers to retain (recent history).
      - name: Prune frontend package versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: dbca-wa
          GHCR_PACKAGE: science-projects-frontend
          KEEP_RELEASES: '15'
          KEEP_JUNK: '10'
        run: python3 .github/scripts/prune_ghcr.py

      - name: Prune backend package versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: dbca-wa
          GHCR_PACKAGE: science-projects-backend
          KEEP_RELEASES: '15'
          KEEP_JUNK: '10'
        run: python3 .github/scripts/prune_ghcr.py

  # ====================== VULNERABILITY SCAN ======================
  scan-frontend:
    name: Scan Frontend Image
    runs-on: ubuntu-latest
    needs: [merge-frontend-prod]
    if: needs.merge-frontend-prod.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          scan-type: "image"
          scanners: "vuln"
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:stable
          format: "cyclonedx"
          output: "sbom-frontend.json"

      - name: Generate SBOM text format (Frontend)
        run: |
          jq -r '
            "SBOM: " + (.metadata.component.name // "frontend") + " (" + (.metadata.component.version // "latest") + ")\n" +
            "Generated: " + (.metadata.timestamp // "unknown") + "\n" +
            "Format: CycloneDX " + (.specVersion // "1.5") + "\n\n" +
            "PACKAGES (" + (.components | length | tostring) + " total):\n" +
            "--------------------------------------------------------------------------------\n" +
            (.components | sort_by(.name) | .[] | .type + "  " + .name + "@" + (.version // "unknown") + (if .purl then "  (" + .purl + ")" else "" end))
          ' sbom-frontend.json > sbom-frontend.txt 2>/dev/null || cp sbom-frontend.json sbom-frontend.txt

      - name: Generate vulnerability CSV (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          scan-type: "image"
          scanners: "vuln"
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:stable
          vuln-type: "library"
          severity: "HIGH,CRITICAL"
          format: "json"
          output: "vuln-frontend.json"

      - name: Convert vulnerabilities to CSV (Frontend)
        run: |
          echo "Package,Installed Version,Fixed Version,Severity,CVE ID,Title" > vuln-frontend.csv
          jq -r '.Results[]? | .Vulnerabilities[]? | [.PkgName, .InstalledVersion, (.FixedVersion // "N/A"), .Severity, .VulnerabilityID, (.Title // "N/A")] | @csv' vuln-frontend.json >> vuln-frontend.csv 2>/dev/null || true

      - name: Run Trivy SARIF scan (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          scan-type: "image"
          scanners: "vuln"
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:stable
          vuln-type: "library"
          severity: "HIGH,CRITICAL"
          format: "sarif"
          output: "trivy-frontend.sarif"

      - name: Upload Frontend scan to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-frontend.sarif"
          category: "trivy-frontend"

      - name: Upload security artifacts (Frontend)
        uses: actions/upload-artifact@v4
        with:
          name: security-frontend-${{ steps.version.outputs.VERSION }}
          path: |
            sbom-frontend.txt
            vuln-frontend.csv
          retention-days: 90

  scan-backend:
    name: Scan Backend Image
    runs-on: ubuntu-latest
    needs: [merge-backend-prod]
    if: needs.merge-backend-prod.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          scan-type: "image"
          scanners: "vuln"
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:stable
          format: "cyclonedx"
          output: "sbom-backend.json"

      - name: Generate SBOM text format (Backend)
        run: |
          jq -r '
            "SBOM: " + (.metadata.component.name // "backend") + " (" + (.metadata.component.version // "latest") + ")\n" +
            "Generated: " + (.metadata.timestamp // "unknown") + "\n" +
            "Format: CycloneDX " + (.specVersion // "1.5") + "\n\n" +
            "PACKAGES (" + (.components | length | tostring) + " total):\n" +
            "--------------------------------------------------------------------------------\n" +
            (.components | sort_by(.name) | .[] | .type + "  " + .name + "@" + (.version // "unknown") + (if .purl then "  (" + .purl + ")" else "" end))
          ' sbom-backend.json > sbom-backend.txt 2>/dev/null || cp sbom-backend.json sbom-backend.txt

      - name: Generate vulnerability CSV (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          scan-type: "image"
          scanners: "vuln"
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:stable
          vuln-type: "library"
          severity: "HIGH,CRITICAL"
          format: "json"
          output: "vuln-backend.json"

      - name: Convert vulnerabilities to CSV (Backend)
        run: |
          echo "Package,Installed Version,Fixed Version,Severity,CVE ID,Title" > vuln-backend.csv
          jq -r '.Results[]? | .Vulnerabilities[]? | [.PkgName, .InstalledVersion, (.FixedVersion // "N/A"), .Severity, .VulnerabilityID, (.Title // "N/A")] | @csv' vuln-backend.json >> vuln-backend.csv 2>/dev/null || true

      - name: Run Trivy SARIF scan (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          scan-type: "image"
          scanners: "vuln"
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:stable
          vuln-type: "library"
          severity: "HIGH,CRITICAL"
          format: "sarif"
          output: "trivy-backend.sarif"

      - name: Upload Backend scan to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-backend.sarif"
          category: "trivy-backend"

      - name: Upload security artifacts (Backend)
        uses: actions/upload-artifact@v4
        with:
          name: security-backend-${{ steps.version.outputs.VERSION }}
          path: |
            sbom-backend.txt
            vuln-backend.csv
          retention-days: 90
