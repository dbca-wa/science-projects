name: Deploy Staging

on:
  push:
    branches: [staging]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: dbca-wa/science-projects

permissions:
  contents: read
  packages: write

jobs:
  # ====================== DETECT CHANGES ======================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy-staging.yml'
              - '.github/workflows/test.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-staging.yml'
              - '.github/workflows/test.yml'

  # ====================== BUILD FRONTEND ======================
  build-frontend:
    name: Build Frontend (${{ matrix.arch }})
    needs: [detect-changes]
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      success() &&
      needs.detect-changes.outputs.frontend == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from git
        id: sha
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          VERSION=$(git describe --tags --always 2>/dev/null || echo "${SHORT_SHA}")
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Build version: ${VERSION}"

      - name: Build and push Frontend image (per-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:test-${{ matrix.arch }}
          build-args: |
            VITE_VERSION=${{ steps.sha.outputs.VERSION }}
            VITE_SENTRY_DSN=https://8dd0517876955893e7c6c13dda43ae8b@o4506736817405952.ingest.us.sentry.io/4507297807663104
          cache-from: type=gha,scope=frontend-staging-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=frontend-staging-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Science Projects Frontend
            org.opencontainers.image.version=${{ steps.sha.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ====================== MERGE FRONTEND MANIFEST ======================
  merge-frontend:
    name: Merge Frontend Manifest
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: success()

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend

          docker buildx imagetools create \
            -t ${IMAGE}:test \
            ${IMAGE}:test-amd64 \
            ${IMAGE}:test-arm64

  # ====================== BUILD BACKEND ======================
  build-backend:
    name: Build Backend (${{ matrix.arch }})
    needs: [detect-changes]
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      success() &&
      needs.detect-changes.outputs.backend == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Backend image (per-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:test-${{ matrix.arch }}
          cache-from: type=gha,scope=backend-staging-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-staging-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Science Projects Backend
            org.opencontainers.image.version=test-${{ steps.sha.outputs.SHORT_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ====================== MERGE BACKEND MANIFEST ======================
  merge-backend:
    name: Merge Backend Manifest
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: success()

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend

          docker buildx imagetools create \
            -t ${IMAGE}:test \
            ${IMAGE}:test-amd64 \
            ${IMAGE}:test-arm64
