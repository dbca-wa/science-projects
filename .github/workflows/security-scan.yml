name: Security Scan

# Builds the production image for each side a pull request changes, scans it
# with Grype and Trivy, and fails if the pull request adds a HIGH or CRITICAL
# finding with an available fix that the baseline image does not already have
# (:test for PRs into staging, :stable for PRs into main). The startup check
# then runs the built images with Postgres and Redis and checks the app
# answers requests, using the baseline image for a side the PR does not
# change. A separate workflow from test.yml so that editing it does not
# trigger the test jobs.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/security-scan.yml"
      - ".github/scripts/vuln_diff.py"
      - ".github/scripts/test_vuln_diff.py"
      - ".github/scripts/install-scanners.sh"
      - ".github/scripts/startup-check.sh"
      - ".github/startup-check/**"

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  group: security-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: dbca-wa/science-projects
  # Pull the Trivy vulnerability DBs from the GHCR mirror to avoid anonymous
  # rate limiting on shared runner IPs.
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1

jobs:
  # ====================== SCRIPT TESTS ======================
  test-scan-script:
    name: Test scan comparison script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run tests
        run: python3 .github/scripts/test_vuln_diff.py

  # ====================== DETECT CHANGES ======================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      sides: ${{ steps.sides.outputs.sides }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/security-scan.yml'
              - '.github/scripts/vuln_diff.py'
              - '.github/scripts/install-scanners.sh'
              - '.github/scripts/startup-check.sh'
              - '.github/startup-check/**'
            backend:
              - 'backend/**'
              - '.github/workflows/security-scan.yml'
              - '.github/scripts/vuln_diff.py'
              - '.github/scripts/install-scanners.sh'
              - '.github/scripts/startup-check.sh'
              - '.github/startup-check/**'
      - name: Build scan matrix
        id: sides
        run: |
          sides=()
          [ "${{ steps.filter.outputs.frontend }}" = "true" ] && sides+=('"frontend"')
          [ "${{ steps.filter.outputs.backend }}" = "true" ] && sides+=('"backend"')
          joined=$(IFS=,; echo "${sides[*]:-}")
          echo "sides=[${joined}]" >> "$GITHUB_OUTPUT"

  # ====================== BUILD AND SCAN ======================
  scan:
    name: Scan ${{ matrix.side }} image
    runs-on: ubuntu-latest
    needs: [detect-changes, test-scan-script]
    if: needs.detect-changes.outputs.sides != '[]'
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(needs.detect-changes.outputs.sides) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.side }}
          file: ./${{ matrix.side }}/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          provenance: false
          sbom: false
          tags: scan-candidate:${{ matrix.side }}
          cache-from: type=gha,scope=security-scan-${{ matrix.side }}
          cache-to: type=gha,mode=min,scope=security-scan-${{ matrix.side }}

      - name: Save image for the startup check
        run: docker save "scan-candidate:${{ matrix.side }}" --output "${{ runner.temp }}/${{ matrix.side }}.tar"

      - name: Upload image for the startup check
        uses: actions/upload-artifact@v4
        with:
          name: startup-image-${{ matrix.side }}
          path: ${{ runner.temp }}/${{ matrix.side }}.tar
          retention-days: 1

      - name: Pull baseline image
        id: baseline
        continue-on-error: true
        env:
          # PRs into main are compared with production (:stable); PRs into
          # staging with the image currently deployed to UAT (:test).
          BASELINE_TAG: ${{ github.base_ref == 'main' && 'stable' || 'test' }}
        run: |
          image="${REGISTRY}/${IMAGE_PREFIX}-${{ matrix.side }}:${BASELINE_TAG}"
          docker pull --platform linux/amd64 "$image"
          docker tag "$image" scan-baseline:${{ matrix.side }}

      - name: Install scanners
        run: bash .github/scripts/install-scanners.sh

      - name: Scan with Grype
        run: |
          side="${{ matrix.side }}"
          config_args=()
          if [ -f "${side}/.grype.yaml" ]; then
            config_args=(--config "${side}/.grype.yaml")
          fi
          grype "docker:scan-candidate:${side}" "${config_args[@]}" -o json --file "grype-candidate.json"
          if [ "${{ steps.baseline.outcome }}" = "success" ]; then
            grype "docker:scan-baseline:${side}" "${config_args[@]}" -o json --file "grype-baseline.json"
          fi

      - name: Scan with Trivy
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          side="${{ matrix.side }}"
          trivy image --scanners vuln --severity HIGH,CRITICAL \
            --format json --output trivy-candidate.json "scan-candidate:${side}"
          if [ "${{ steps.baseline.outcome }}" = "success" ]; then
            trivy image --scanners vuln --severity HIGH,CRITICAL \
              --format json --output trivy-baseline.json "scan-baseline:${side}"
          fi

      - name: Compare with baseline
        id: compare
        run: |
          {
            echo "## ${{ matrix.side }} image scan"
            if [ "${{ steps.baseline.outcome }}" != "success" ]; then
              echo ""
              echo "The baseline image could not be pulled, so findings are reported without comparison."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          for scanner in grype trivy; do
            baseline_args=()
            if [ -f "${scanner}-baseline.json" ]; then
              baseline_args=(--baseline "${scanner}-baseline.json")
            fi
            python3 .github/scripts/vuln_diff.py \
              --scanner "$scanner" \
              --candidate "${scanner}-candidate.json" \
              "${baseline_args[@]}" \
              --min-severity HIGH --only-fixable \
              --title "${scanner} (${{ matrix.side }})" \
              --summary "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit "$status"

      - name: Generate Trivy SARIF
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL \
            --format sarif --output trivy-candidate.sarif "scan-candidate:${{ matrix.side }}"

      - name: Upload Trivy SARIF
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-candidate.sarif
          category: trivy-pr-${{ matrix.side }}

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ matrix.side }}
          path: |
            grype-*.json
            trivy-*.json
            trivy-*.sarif
          retention-days: 14
          if-no-files-found: ignore

  # ====================== STARTUP CHECK ======================
  startup:
    name: Start the app
    runs-on: ubuntu-latest
    needs: [detect-changes, scan]
    # Runs even when the scan finds new vulnerabilities; fails when an image
    # the PR changes did not build.
    if: ${{ !cancelled() && needs.detect-changes.outputs.sides != '[]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built images
        uses: actions/download-artifact@v8
        with:
          pattern: startup-image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Load images
        env:
          SIDES: ${{ needs.detect-changes.outputs.sides }}
          BASELINE_TAG: ${{ github.base_ref == 'main' && 'stable' || 'test' }}
        run: |
          for side in frontend backend; do
            if [[ "$SIDES" == *"\"${side}\""* ]]; then
              docker load --input "${RUNNER_TEMP}/images/${side}.tar"
              image="scan-candidate:${side}"
            else
              image="${REGISTRY}/${IMAGE_PREFIX}-${side}:${BASELINE_TAG}"
              docker pull --platform linux/amd64 "$image"
            fi
            echo "${side^^}_IMAGE=${image}" >> "$GITHUB_ENV"
          done

      - name: Start the app and check it responds
        run: |
          bash .github/scripts/startup-check.sh \
            /api/v1/users/me=401,403 \
            /api/v1/projects/mine=401,403
