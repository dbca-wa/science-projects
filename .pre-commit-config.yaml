# Root-level pre-commit configuration for monorepo
# This orchestrates frontend and backend pre-commit hooks based on changed files
# See https://pre-commit.com for more information

repos:
  # General file checks (applies to all files)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '\.(png|jpg|jpeg|gif|ico|bmp|tif|tiff|webp|svg|woff|woff2|ttf|eot|otf|pdf|eml|lock|zip|tar|gz|bz2|mp3|mp4|wav|ogg|avi|mov)$'
      - id: end-of-file-fixer
        exclude: '\.(png|jpg|jpeg|gif|ico|bmp|tif|tiff|webp|svg|woff|woff2|ttf|eot|otf|pdf|eml|lock|zip|tar|gz|bz2|mp3|mp4|wav|ogg|avi|mov)$'
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(png|jpg|jpeg|gif|ico|bmp|tif|tiff|webp|svg|woff|woff2|ttf|eot|otf|pdf|eml|lock|zip|tar|gz|bz2|mp3|mp4|wav|ogg|avi|mov)$'

  # Frontend pre-commit hooks (only run when frontend files change)
  - repo: local
    hooks:
      - id: frontend-checks
        name: Frontend pre-commit checks
        entry: ./.pre-commit-frontend-wrapper.sh
        language: script
        files: ^frontend/
        pass_filenames: false
        verbose: true

  # Backend pre-commit hooks (only run when backend files change)
  - repo: local
    hooks:
      - id: backend-checks
        name: Backend pre-commit checks
        entry: ./.pre-commit-backend-wrapper.sh
        language: script
        files: ^backend/
        pass_filenames: false
        verbose: true

  # Pre-push enforcement (BLOCKING). Commit freely with warnings; push must be clean.
  - repo: local
    hooks:
      - id: frontend-push-checks
        name: Frontend pre-push checks (blocking)
        entry: ./.pre-push-frontend-wrapper.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
      - id: backend-push-checks
        name: Backend pre-push checks (blocking)
        entry: ./.pre-push-backend-wrapper.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true

# Global settings
fail_fast: false
minimum_pre_commit_version: '3.0.0'
# Install both commit-time and push-time hooks when running `pre-commit install`.
default_install_hook_types: [pre-commit, pre-push]

# Exclude patterns
exclude: |
  (?x)^(
      \.git/.*|
      \.github/.*|
      node_modules/.*|
      __pycache__/.*|
      \.venv/.*|
      venv/.*|
      build/.*|
      dist/.*|
      coverage/.*|
      staticfiles/.*|
      migrations/.*
  )$
